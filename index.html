<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mes Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Mes Notes</h1>
        <div class="main-layout">
            <ul id="notesList"></ul>

            <div class="editor">
                <input type="hidden" id="noteId">
                <textarea id="noteInput" placeholder="Tape ton texte ici..."></textarea>
                <div class="actions">
                    <button id="saveBtn">Sauvegarder</button>
                    <button id="newBtn">Nouvelle note</button>
                    <button id="deleteBtn" style="display: none; background-color: #ff4444;">Supprimer</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
