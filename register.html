<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Mes Notes</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Compte Personnel</h1>
        <div id="auth-form">
            <input type="text" id="username" placeholder="Nom d'utilisateur" required>
            <input type="password" id="password" placeholder="Mot de passe" minlength="6" required>
            <div style="margin-top: 10px;">
                <button id="loginBtn">Se connecter</button>
                <button id="regBtn" style="background-color: #bb86fc;">S'inscrire</button>
            </div>
        </div>
        <div id="status"></div>
    </div>

    <script src="register.js"></script>
</body>
</html>
